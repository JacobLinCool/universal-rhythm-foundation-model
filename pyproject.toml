[project]
name = "urfm"
version = "0.1.0"
description = "Universal Rhythm Foundation Model: a lossless cross-game chart IR and tooling for learning transferable musical-interaction representations."
readme = "README.md"
license = "MIT"
authors = [{ name = "JacobLinCool", email = "jacoblincool@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.19",
    "msdparser>=2",
]

[project.scripts]
urfm = "urfm.cli:main"

[project.optional-dependencies]
data = ["huggingface-hub>=0.30", "numpy>=2", "pyarrow>=17"]
train = ["torch>=2.5", "torchaudio>=2.5"]
colab = [
    "google-colab-cli>=0.7.4",
]
app = [
    "gradio>=5",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.6",
    "setuptools<81",  # pkg_resources, still imported by simfile -> fs (timing oracle in tests)
    "simfile>=2.1",
    "tja>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
